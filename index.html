<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بين بابين</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">

    <h1>بين بابين</h1>

    <p class="subtitle">
        ليست هذه مساحة للإجابات...
        <br>
        بل مكانٌ هادئ، لعلّ سؤالًا واحدًا يفتح بابًا جديدًا في داخلك.
    </p>

</header>

<section class="doors">

    <div class="door">
        <div class="icon">🚪</div>
        <h2>باب القراءة</h2>

        <p>
            تأملات قصيرة...
            ليست لتخبرك ماذا تفعل،
            بل لتدعوك أن تنظر إلى نفسك.
        </p>

        <button>ادخل</button>

    </div>

    <div class="door">

        <div class="icon">✍🏻</div>

        <h2>باب الكتابة</h2>

        <p>
            صفحة خاصة بك...
            اكتب فيها ما لا تستطيع قوله لأحد.
        </p>

        <button>ابدأ الكتابة</button>

    </div>

</section>

<footer>

بين بابين © 2026

</footer>

<script src="script.js"></script>

</html>
